<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner Rosé">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23FAF7F2'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' fill='%23C98B8B' font-family='Georgia,serif'%3E%E2%9C%BF%3C/text%3E%3C/svg%3E">

<title>Planner Rosé</title>
<meta name="theme-color" content="#FAF7F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: coluna única de planner (máx. 520px), cartões brancos sobre papel off-white, barra de abas fixa embaixo. */
:root {
  --bg: #FAF7F2;
  --surface: #FFFFFF;
  --nude: #E8D5C4;
  --nude-soft: #F4EBE2;
  --rose: #C98B8B;
  --rose-deep: #A9696B;
  --ink: #4A3B38;
  --muted: #8E7D77;
  --line: #EDE3DA;
  --ok: #7FA27B;
  --warn: #CF9A4E;
  --bad: #C0605F;
  --shadow: 0 1px 2px rgba(74,59,56,.04), 0 8px 24px rgba(169,105,107,.07);
  --font-display: "Cormorant Garamond", "Playfair Display", Georgia, "Times New Roman", serif;
  --font-body: "Jost", "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 20px;
  --tabbar-h: 68px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E1816; --surface: #29211F; --nude: #4B3D36; --nude-soft: #342A27;
    --rose: #D9A1A0; --rose-deep: #EBB9B6; --ink: #F3E9E2; --muted: #B6A49C; --line: #3D322E;
    --ok: #9DC198; --warn: #E2B26A; --bad: #E58A88;
    --shadow: 0 1px 2px rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1E1816; --surface: #29211F; --nude: #4B3D36; --nude-soft: #342A27;
  --rose: #D9A1A0; --rose-deep: #EBB9B6; --ink: #F3E9E2; --muted: #B6A49C; --line: #3D322E;
  --ok: #9DC198; --warn: #E2B26A; --bad: #E58A88;
  --shadow: 0 1px 2px rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; font-weight: 400; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; border-radius: 10px; }
main {
  max-width: 520px; margin: 0 auto;
  padding-block: 20px calc(var(--tabbar-h) + 40px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 500; margin: 0; text-wrap: balance; letter-spacing: .005em; }
h1 { font-size: 2.3rem; line-height: 1.05; }
h1 em { font-style: italic; color: var(--rose-deep); font-weight: 500; }
h2 { font-size: 1.45rem; line-height: 1.15; }
h3 { font-size: 1.15rem; }
p { margin: 0; }
.eyebrow { font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.num { font-variant-numeric: tabular-nums; }

/* cartões e seções */
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.link { font-size: .85rem; color: var(--rose-deep); font-weight: 500; }
.empty { color: var(--muted); font-size: .9rem; padding: 6px 0; }
.divider { height: 1px; background: var(--line); border: 0; margin: 0; }

/* hero / saudação */
.hello { display: flex; flex-direction: column; gap: 6px; padding-top: 6px; }
.quote { margin: 0; padding: 16px 18px; border-radius: var(--r); background: var(--nude-soft); display: flex; gap: 12px; align-items: flex-start; }
.quote span { font-family: var(--font-display); font-size: 2.2rem; line-height: .8; color: var(--rose); }
.quote blockquote { margin: 0; font-family: var(--font-display); font-style: italic; font-size: 1.12rem; line-height: 1.35; }

.stats { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.stat { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; text-align: left; }
.stat b { font-family: var(--font-display); font-size: 1.7rem; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .bar { margin-top: 6px; }

.bar { height: 6px; border-radius: 99px; background: var(--nude-soft); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--rose); width: 0; transition: width .6s ease; }
.bar.warn > i { background: var(--warn); }
.bar.bad > i { background: var(--bad); }
.bar.ok > i { background: var(--ok); }

/* listas */
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.list > li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; }
.list > li:first-child { border-top: 0; }
.row-main { flex: 1; min-width: 0; text-align: left; display: flex; flex-direction: column; gap: 1px; }
.row-main .t { overflow-wrap: anywhere; }
.row-main small { color: var(--muted); font-size: .78rem; }
.row-end { text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.emo { width: 36px; height: 36px; border-radius: 12px; background: var(--nude-soft); display: grid; place-items: center; font-size: 1.05rem; flex-shrink: 0; }

.check { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--nude); display: grid; place-items: center; flex-shrink: 0; transition: background .2s, border-color .2s; }
.check svg { width: 14px; height: 14px; stroke: var(--surface); opacity: 0; transform: scale(.6); transition: .2s; }
.check[aria-pressed="true"] { background: var(--rose); border-color: var(--rose); }
.check[aria-pressed="true"] svg { opacity: 1; transform: scale(1); }
.done .t { text-decoration: line-through; color: var(--muted); }
.prio { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: 1px; }
.prio.alta { background: var(--bad); } .prio.media { background: var(--warn); } .prio.baixa { background: var(--nude); }

/* chips e botões */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: .72rem; padding: 2px 9px; border-radius: 99px; background: var(--nude-soft); color: var(--muted); white-space: nowrap; font-weight: 500; }
.chip.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.chip.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.chip.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border-radius: 99px; font-weight: 500; font-size: .9rem; background: var(--rose); color: #fff; transition: transform .1s, background .2s; }
:root[data-theme="dark"] .btn { color: #2A1F1D; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { color: #2A1F1D; } }
.btn:active { transform: scale(.97); }
.btn.ghost { background: var(--nude-soft); color: var(--ink); }
.btn.line { background: transparent; border: 1px solid var(--nude); color: var(--ink); }
.btn.danger { background: transparent; border: 1px solid color-mix(in srgb, var(--bad) 50%, transparent); color: var(--bad); }
.btn.sm { padding: 6px 12px; font-size: .8rem; }
.btn.block { width: 100%; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--nude-soft); flex-shrink: 0; }
.icon-btn svg { width: 18px; height: 18px; }

.seg { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.seg::-webkit-scrollbar { display: none; }
.seg button { padding: 7px 14px; border-radius: 99px; font-size: .85rem; white-space: nowrap; color: var(--muted); background: transparent; border: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

.month-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.month-nav h2 { text-align: center; }

/* calendário */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 4px; }
.cal .wd { text-align: center; font-size: .7rem; color: var(--muted); letter-spacing: .1em; padding-bottom: 4px; }
.cal button.day { aspect-ratio: 1 / 1; max-width: 100%; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: .9rem; font-variant-numeric: tabular-nums; }
.cal button.day.out { color: var(--muted); opacity: .45; }
.cal button.day.today { box-shadow: inset 0 0 0 1px var(--rose); }
.cal button.day.sel { background: var(--rose); color: #fff; }
.cal button.day.sel .dots i { background: #fff !important; }
.dots { display: flex; gap: 3px; height: 5px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; display: block; }
.d-task { background: var(--rose); } .d-event { background: var(--ink); } .d-bill { background: var(--warn); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .75rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* finanças */
.balance { background: var(--ink); color: var(--bg); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.balance .eyebrow { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.balance b { font-family: var(--font-display); font-size: 2.6rem; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.balance .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.balance .split div { display: flex; flex-direction: column; gap: 2px; font-variant-numeric: tabular-nums; }
.pos { color: var(--ok); } .neg { color: var(--bad); }
.chart-box { position: relative; width: 100%; max-width: 100%; }
.chart-box.donut { width: 200px; height: 200px; max-width: 100%; margin: 0 auto; }
.chart-box.bars { height: 200px; }
.leg-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.leg-list li { display: flex; align-items: center; gap: 10px; font-size: .88rem; }
.leg-list i { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.leg-list span:nth-child(2) { flex: 1; min-width: 0; }
.fab { position: fixed; right: max(18px, calc(env(safe-area-inset-right, 0px) + 18px)); bottom: calc(var(--tabbar-h) + 18px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; border-radius: 50%; background: var(--rose); color: #fff; display: grid; place-items: center; box-shadow: 0 10px 24px rgba(169,105,107,.35); z-index: 20; }
.fab svg { width: 24px; height: 24px; }
.card-plastic { border-radius: 18px; padding: 16px; background: linear-gradient(135deg, var(--nude) 0%, var(--rose) 100%); color: #fff; display: flex; flex-direction: column; gap: 10px; }
.card-plastic .eyebrow { color: rgba(255,255,255,.8); }
.card-plastic b { font-family: var(--font-display); font-size: 1.8rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.card-plastic .bar { background: rgba(255,255,255,.3); }
.card-plastic .bar > i { background: #fff; }

/* eu */
.cups { display: flex; flex-wrap: wrap; gap: 6px; }
.cup { width: 26px; height: 32px; border-radius: 4px 4px 9px 9px; border: 1.5px solid var(--nude); position: relative; overflow: hidden; }
.cup.full::after { content: ""; position: absolute; inset: 35% 0 0; background: var(--rose); opacity: .8; }
.water { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.water b { font-family: var(--font-display); font-size: 2rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.moods { display: flex; justify-content: space-between; gap: 6px; }
.moods button { flex: 1; aspect-ratio: 1/1; max-width: 56px; border-radius: 16px; font-size: 1.5rem; background: var(--nude-soft); transition: transform .15s, box-shadow .15s; }
.moods button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--rose); transform: scale(1.06); background: var(--surface); }
.mood-map { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 5px; }
.mood-map div { aspect-ratio: 1/1; border-radius: 10px; background: var(--nude-soft); display: grid; place-items: center; font-size: .95rem; }
.mood-map div.blank { background: transparent; }
.mood-map div small { font-size: .62rem; color: var(--muted); }
.week { display: flex; gap: 4px; }
.week i { width: 9px; height: 9px; border-radius: 50%; background: var(--nude-soft); display: block; }
.week i.on { background: var(--rose); }
.sleep-bars { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 6px; align-items: end; height: 90px; }
.sleep-bars div { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
.sleep-bars span.b { width: 100%; max-width: 22px; border-radius: 8px 8px 4px 4px; background: var(--nude); }
.sleep-bars span.b.good { background: var(--rose); }
.sleep-bars small { font-size: .65rem; color: var(--muted); }
.soon { display: flex; flex-wrap: wrap; gap: 6px; }

/* formulários */
form.fields { display: flex; flex-direction: column; gap: 14px; }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: .8rem; color: var(--muted); font-weight: 500; letter-spacing: .02em; }
.f input, .f select, .f textarea { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 11px 14px; font-size: 1rem; color: var(--ink); }
.f input:focus, .f select:focus, .f textarea:focus { outline: none; border-color: var(--rose); }
.f-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.radio-seg { display: flex; background: var(--nude-soft); border-radius: 99px; padding: 4px; gap: 4px; }
.radio-seg label { flex: 1; text-align: center; }
.radio-seg input { position: absolute; opacity: 0; pointer-events: none; }
.radio-seg span { display: block; padding: 8px 10px; border-radius: 99px; font-size: .88rem; color: var(--muted); cursor: pointer; }
.radio-seg input:checked + span { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.radio-seg input:focus-visible + span { outline: 2px solid var(--rose); }
.wdays { display: flex; gap: 6px; flex-wrap: wrap; }
.wdays label input { position: absolute; opacity: 0; pointer-events: none; }
.wdays label span { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--nude-soft); font-size: .8rem; color: var(--muted); cursor: pointer; }
.wdays label input:checked + span { background: var(--rose); color: #fff; }

/* sheet + diálogo */
.overlay { position: fixed; inset: 0; background: rgba(40,28,26,.35); z-index: 50; display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; border-radius: 26px 26px 0 0; padding: 10px 20px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; animation: up .25s ease; }
.sheet .grip { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.overlay.center { align-items: center; padding: 20px; }
.dialog { background: var(--surface); border-radius: 24px; padding: 22px; max-width: 380px; width: 100%; display: flex; flex-direction: column; gap: 16px; animation: up .2s ease; }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(24px); opacity: 0; } }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 6px max(10px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); }
.tabbar ul { list-style: none; margin: 0 auto; padding: 0; max-width: 520px; display: grid; grid-template-columns: repeat(5, 1fr); }
.tabbar a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: var(--muted); text-decoration: none; font-size: .7rem; letter-spacing: .04em; }
.tabbar a svg { width: 22px; height: 22px; }
.tabbar a[aria-current="page"] { color: var(--rose-deep); }
.tabbar a[aria-current="page"] svg { stroke-width: 1.8; }
svg.i { fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }

.banner { border-radius: 16px; padding: 12px 14px; background: color-mix(in srgb, var(--warn) 14%, var(--surface)); display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; font-size: .88rem; }
.toast { position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(10px); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-size: .88rem; opacity: 0; pointer-events: none; transition: .25s; z-index: 60; max-width: calc(100vw - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.onboard { text-align: center; align-items: center; }
.onboard .mark { font-family: var(--font-display); font-size: 2.6rem; color: var(--rose); line-height: 1; }
/* etapa 2 */
.d-cycle { background: var(--bad); }
.d-pred { background: transparent; box-shadow: inset 0 0 0 1px var(--bad); }
.timer { font-variant-numeric: tabular-nums; font-weight: 500; }
.big { font-family: var(--font-display); font-size: 2rem; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.subj { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; background: var(--nude-soft); min-width: 0; }
.subj-head { display: flex; align-items: center; gap: 10px; }
.subj .list > li { border-top-color: color-mix(in srgb, var(--ink) 8%, transparent); }
.subj .chip:not(.ok):not(.warn) { background: var(--surface); }
.stars { color: var(--warn); letter-spacing: 1px; }
.vision { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.vision button { background: var(--nude-soft); border-radius: 16px; padding: 16px 14px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; text-align: left; min-height: 104px; min-width: 0; }
.vision b { font-size: 1.6rem; font-weight: 400; line-height: 1; }
.vision span { font-family: var(--font-display); font-size: 1.1rem; line-height: 1.2; overflow-wrap: anywhere; }
.cycle-hero { background: var(--nude-soft); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.cycle-hero b { font-family: var(--font-display); font-size: 2.2rem; font-weight: 500; line-height: 1.05; }
.inline-add { display: flex; gap: 8px; }
.inline-add input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 10px 16px; font-size: 1rem; color: var(--ink); }
.inline-add input:focus { outline: none; border-color: var(--rose); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
button.chip { cursor: pointer; padding: 5px 11px; font-size: .8rem; }
input[type=range] { accent-color: var(--rose); width: 100%; padding: 0; border: 0; background: transparent; }
.seg.sub button { font-size: .8rem; padding: 5px 12px; }
.seg.sub button[aria-pressed="true"] { background: var(--rose); border-color: var(--rose); color: #fff; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<main id="view" aria-live="polite"></main>

<script>
(() => {
'use strict';
/* ---------- utilidades ---------- */
const KEY = 'plannerRose.v1';
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d || 1); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const addMonths = (s, n) => { const d = parse(s), day = d.getDate(); const t = new Date(d.getFullYear(), d.getMonth() + n, 1); const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate(); t.setDate(Math.min(day, last)); return iso(t); };
const mKey = s => s.slice(0, 7);
const mShift = (k, n) => mKey(addMonths(k + '-01', n));
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const money = c => BRL.format((c || 0) / 100);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtLong = s => parse(s).toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtShort = s => parse(s).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
const fmtMonth = k => { const s = parse(k + '-01').toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }); return s.charAt(0).toUpperCase() + s.slice(1); };
const fmtMonthShort = k => parse(k + '-01').toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '');
const WD = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];
const WD_NAMES = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
function parseMoney(s) {
  s = String(s || '').trim().replace(/[R$\s]/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if ((s.match(/\./g) || []).length > 1 || /\.\d{3}$/.test(s)) s = s.replace(/\./g, '');

/* ---------- frases do dia ---------- */

  'Sonhos grandes cabem em metas pequenas.', 'Hoje: um pouco melhor que ontem.', 'Gratidão muda o tom do dia.', 'Você é a prioridade da sua própria agenda.',
  'Estudar um pouco todo dia é um presente para você.', 'O piano não se aprende num dia, e tudo bem.', 'Guardar um pouco hoje é viajar amanhã.',
  'Diga não ao que pesa e sim ao que acrescenta.', 'Uma mente organizada descansa melhor.', 'Faça uma pausa antes de ficar cansada.',

];
const quoteFor = d => QUOTES[(Math.floor(parse(d).getTime() / 86400000) % QUOTES.length + QUOTES.length) % QUOTES.length];

/* ---------- estado ---------- */
const DEFAULT_CATS = [
  ['moradia', 'Moradia', '🏠', 'despesa'], ['mercado', 'Mercado', '🛒', 'despesa'], ['transporte', 'Transporte', '🚗', 'despesa'],
  ['saude', 'Saúde', '🩺', 'despesa'], ['lazer', 'Lazer', '🎈', 'despesa'], ['educacao', 'Educação', '📚', 'despesa'],
  ['beleza', 'Beleza', '💄', 'despesa'], ['assinaturas', 'Assinaturas', '📺', 'despesa'], ['outros', 'Outros', '✨', 'despesa'],
  ['salario', 'Salário', '💼', 'receita'], ['extra', 'Renda extra', '🌱', 'receita'], ['outrasr', 'Outras receitas', '💰', 'receita']
].map(([id, name, emoji, type]) => ({ id, name, emoji, type }));
function defaults() {
  return {
    version: 1,
    settings: { name: '', theme: 'auto', waterGoal: 8, lastBackup: null, onboarded: false, sample: false, createdAt: today() },
    tasks: [], events: [], categories: DEFAULT_CATS.map(c => ({ ...c })), transactions: [], budgets: {},
    bills: [], cards: [], savings: [],
    habits: [{ id: 'h1', name: 'Meditar 5 minutos', emoji: '🧘‍♀️' }, { id: 'h2', name: 'Tomar vitaminas', emoji: '💊' }, { id: 'h3', name: 'Alongar', emoji: '🤸‍♀️' }],
    habitLog: {}, water: {}, sleep: {}, mood: {},
    study: {
      subjects: [{ id: 'piano', name: 'Piano', emoji: '🎹', goal: 180 }, { id: 'ingles', name: 'Inglês', emoji: '🗣️', goal: 180 }, { id: 'cursos', name: 'Cursos do trabalho', emoji: '💼', goal: 120 }],
      sessions: [], items: [], courses: [], running: null
    },
    books: [], readingGoal: 12, workouts: [], workoutGoal: 4, media: [],
    skincare: {
      am: [{ id: 's1', name: 'Limpeza' }, { id: 's2', name: 'Vitamina C' }, { id: 's3', name: 'Hidratante' }, { id: 's4', name: 'Protetor solar' }],
      pm: [{ id: 's5', name: 'Demaquilante' }, { id: 's6', name: 'Limpeza' }, { id: 's7', name: 'Sérum' }, { id: 's8', name: 'Hidratante' }]
    },
    skinLog: {}, journal: {}, goals: [], vision: [], periods: [],
    shopping: [], frequent: { mercado: ['Leite', 'Ovos', 'Pão', 'Frutas', 'Café', 'Iogurte'], farmacia: ['Protetor solar', 'Vitaminas', 'Absorvente'] }
  };
}
function migrate(o) {
  const d = defaults();
  if (!o || typeof o !== 'object') return d;
  const s = { ...d };
  for (const k of Object.keys(d)) {
    const dv = d[k], ov = o[k];
    if (ov === undefined || ov === null) continue;
    if (Array.isArray(dv)) s[k] = Array.isArray(ov) ? ov : dv;
    else if (dv && typeof dv === 'object') s[k] = typeof ov === 'object' && !Array.isArray(ov) ? { ...dv, ...ov } : dv;
    else s[k] = typeof ov === typeof dv ? ov : dv;
  }
  s.version = 2;
  return s;
}
let S;
try { S = migrate(JSON.parse(localStorage.getItem(KEY) || 'null')); } catch (e) { S = defaults(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Não consegui salvar neste navegador. Faça um backup.'); } }

const ui = { tab: 'hoje', calMonth: mKey(today()), calDay: today(), finMonth: mKey(today()), finTab: 'resumo',
  euTab: 'bem', hobTab: 'leitura', mediaTab: 'quero', goalScope: 'mes', journalDate: today(), maisTab: 'compras', shopList: 'mercado' };

/* ---------- regras: tarefas ---------- */
function taskStart(t) { return t.date || t.created || today(); }
function occurs(t, d) {
  const r = t.repeat || 'none';
  if (r === 'none') return t.date === d;
  if (d < taskStart(t)) return false;
  if (r === 'daily') return true;
  if (r === 'weekdays') return (t.days || []).includes(parse(d).getDay());
  if (r === 'monthly') return parse(d).getDate() === parse(taskStart(t)).getDate();
  return false;
}
const isDone = (t, d) => (t.repeat || 'none') === 'none' ? (t.doneDates || []).length > 0 : (t.doneDates || []).includes(d);
const PRI = { alta: 0, media: 1, baixa: 2 };
const byPri = (a, b) => (PRI[a.priority] ?? 1) - (PRI[b.priority] ?? 1);
function tasksForDay(d) {
  const list = S.tasks.filter(t => occurs(t, d));
  if (d === today()) {
    S.tasks.forEach(t => {
      if ((t.repeat || 'none') !== 'none' || list.includes(t)) return;
      if (!t.date && (!isDone(t, d) || (t.doneDates || []).includes(d))) list.push(t);
      else if (t.date && t.date < d && !isDone(t, d)) list.push(t);
    });
  }
  return list.sort(byPri);
}
const repeatLabel = t => ({ none: '', daily: 'todo dia', weekdays: (t.days || []).sort().map(i => WD_NAMES[i]).join(', '), monthly: 'todo mês' }[t.repeat || 'none']);

/* ---------- regras: finanças ---------- */
const cat = id => S.categories.find(c => c.id === id) || { id, name: 'Sem categoria', emoji: '·', type: 'despesa' };
const txMonth = k => S.transactions.filter(t => mKey(t.date) === k);
const sum = (arr, f = x => x.amount) => arr.reduce((a, x) => a + (f(x) || 0), 0);
function monthTotals(k) {
  const tx = txMonth(k);
  const inc = sum(tx.filter(t => t.type === 'receita')), out = sum(tx.filter(t => t.type === 'despesa'));
  return { inc, out, bal: inc - out };
}
function spentByCat(k) {
  const m = {};
  txMonth(k).filter(t => t.type === 'despesa').forEach(t => { m[t.catId] = (m[t.catId] || 0) + t.amount; });
  return m;
}
function budgetState(spent, budget) { if (!budget) return ''; const p = spent / budget; return p >= 1 ? 'bad' : p >= .8 ? 'warn' : 'ok'; }
// fatura: compra no dia do fechamento ou depois cai na fatura do mês seguinte
function invoiceKey(tx, card) { const d = parse(tx.date); const k = mKey(tx.date); return d.getDate() >= card.closeDay ? mShift(k, 1) : k; }
function invoiceDue(card, key) { const due = card.dueDay > card.closeDay ? key : mShift(key, 1); const [y, m] = due.split('-').map(Number); const last = new Date(y, m, 0).getDate(); return `${due}-${pad(Math.min(card.dueDay, last))}`; }
function invoiceTx(card, key) { return S.transactions.filter(t => t.method === 'cartao' && t.cardId === card.id && invoiceKey(t, card) === key); }
function currentInvoiceKey(card) { const d = new Date(); const k = mKey(today()); return d.getDate() >= card.closeDay ? mShift(k, 1) : k; }
function billsDue(d) { return S.bills.filter(b => !b.paidOn && b.due === d); }
function invoicesDue(d) {
  const out = [];
  S.cards.forEach(c => { for (let n = -2; n <= 2; n++) { const key = mShift(mKey(d), n); if (invoiceDue(c, key) === d) { const tot = sum(invoiceTx(c, key)); if (tot > 0) out.push({ card: c, key, total: tot }); } } });
  return out;
}

/* ---------- regras: hábitos ---------- */
function habitDone(hid, d) { return (S.habitLog[d] || []).includes(hid); }
function streak(hid) {
  let d = today(), n = 0;
  if (!habitDone(hid, d)) d = addDays(d, -1);
  while (habitDone(hid, d)) { n++; d = addDays(d, -1); }
  return n;
}
function sleepMinutes(e) {
  if (!e || !e.bed || !e.wake) return null;
  const [bh, bm] = e.bed.split(':').map(Number), [wh, wm] = e.wake.split(':').map(Number);
  let m = (wh * 60 + wm) - (bh * 60 + bm); if (m <= 0) m += 1440; return m;
}
const hm = m => m < 60 ? `${m} min` : `${Math.floor(m / 60)}h${m % 60 ? pad(m % 60) : ''}`;
const MOODS = [['😄', 'Ótimo'], ['🙂', 'Bem'], ['😐', 'Neutro'], ['😔', 'Pra baixo'], ['😣', 'Difícil']];

/* ---------- componentes ---------- */
function taskItem(t, d) {
  const done = isDone(t, d), late = t.repeat === 'none' && t.date && t.date < today() && !done;
  const meta = [repeatLabel(t), late ? '' : (t.repeat === 'none' && t.date && d !== t.date ? fmtShort(t.date) : '')].filter(Boolean).join(' · ');
  return `<li class="${done ? 'done' : ''}">
    <button class="check" data-act="toggleTask" data-id="${t.id}" data-date="${d}" aria-pressed="${done}" aria-label="Concluir ${esc(t.title)}">${ICON.check}</button>
    <button class="row-main" data-act="editTask" data-id="${t.id}"><span class="t"><i class="prio ${t.priority || 'media'}"></i>${esc(t.title)}</span>${meta || late ? `<small>${late ? `<span class="chip bad">atrasada · ${fmtShort(t.date)}</span> ` : ''}${esc(meta)}</small>` : ''}</button>
  </li>`;
}
function eventItem(e) {
  return `<li><span class="emo num" style="font-size:.78rem">${e.time ? esc(e.time) : '—'}</span>
    <button class="row-main" data-act="editEvent" data-id="${e.id}"><span class="t">${esc(e.title)}</span>${e.note ? `<small>${esc(e.note)}</small>` : ''}</button></li>`;
}
function dueChip(due) {
  const n = daysBetween(today(), due);
  if (n < 0) return `<span class="chip bad">atrasada ${-n}d</span>`;
  if (n === 0) return `<span class="chip warn">vence hoje</span>`;
  if (n <= 3) return `<span class="chip warn">em ${n}d</span>`;
  return `<span class="chip">${fmtShort(due)}</span>`;
}
const billChip = b => dueChip(b.due);
function billItem(b) {
  const c = cat(b.catId);
  return `<li><span class="emo">${c.emoji}</span>
    <button class="row-main" data-act="editBill" data-id="${b.id}"><span class="t">${esc(b.title)}</span><small>${money(b.amount)}${b.repeat === 'mensal' ? ' · mensal' : ''}</small></button>
    <span class="row-end" style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">${billChip(b)}<button class="btn sm" data-act="payBill" data-id="${b.id}">Pagar</button></span></li>`;
}
function txItem(t) {
  const c = cat(t.catId), card = t.method === 'cartao' ? S.cards.find(x => x.id === t.cardId) : null;
  return `<li><span class="emo">${c.emoji}</span>
    <button class="row-main" data-act="editTx" data-id="${t.id}"><span class="t">${esc(t.desc || c.name)}</span><small>${esc(c.name)}${card ? ' · ' + esc(card.name) : ''}</small></button>
    <span class="row-end ${t.type === 'receita' ? 'pos' : ''}">${t.type === 'receita' ? '+' : '−'} ${money(t.amount)}</span></li>`;
}
const bar = (pct, cls = '') => `<div class="bar ${cls}"><i style="width:${Math.max(0, Math.min(100, pct)).toFixed(1)}%"></i></div>`;

/* ---------- telas ---------- */
const views = {};
views.hoje = () => {
  const d = today(), h = new Date().getHours();
  const greet = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
  const tasks = tasksForDay(d), doneN = tasks.filter(t => isDone(t, d)).length;
  const water = S.water[d] || 0, goal = S.settings.waterGoal || 8;
  const habN = S.habits.filter(x => habitDone(x.id, d)).length;
  const spentToday = sum(S.transactions.filter(t => t.date === d && t.type === 'despesa'));
  const events = S.events.filter(e => e.date === d).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
  const bills = S.bills.filter(b => !b.paidOn && b.due <= addDays(d, 7)).sort((a, b) => a.due.localeCompare(b.due));
  const invs = []; for (let i = 0; i <= 7; i++) invs.push(...invoicesDue(addDays(d, i)));
  const mood = S.mood[d];
  const sinceBackup = daysBetween(S.settings.lastBackup || S.settings.createdAt || d, d);
  return `
  ${S.settings.sample ? `<div class="banner"><span>Você está vendo dados de exemplo.</span><button class="btn sm ghost" data-act="clearSample">Começar do zero</button></div>` : ''}
  ${!S.settings.sample && sinceBackup > 30 ? `<div class="banner"><span>Seu último backup foi há mais de 30 dias.</span><button class="btn sm ghost" data-act="exportData">Fazer backup</button></div>` : ''}
  ${S.study.running ? `<div class="banner" style="background:var(--nude-soft)"><span>${esc(subj(S.study.running.subjectId).emoji)} ${esc(subj(S.study.running.subjectId).name)} · <span class="timer" data-timer>${timerText()}</span></span><button class="btn sm" data-act="timerStop">Parar</button></div>` : ''}
  <header class="hello"><p class="eyebrow">${esc(fmtLong(d))}</p><h1>${greet}${S.settings.name ? `, <em>${esc(S.settings.name)}</em>` : ''}</h1></header>
  <figure class="quote"><span aria-hidden="true">“</span><blockquote>${esc(quoteFor(d))}</blockquote></figure>
  <section class="stats" aria-label="Resumo do dia">
    <a class="stat" href="#agenda" style="color:inherit;text-decoration:none"><span class="eyebrow">Tarefas</span><b>${doneN}<span class="muted" style="font-size:1rem">/${tasks.length}</span></b>${bar(tasks.length ? doneN / tasks.length * 100 : 0)}</a>
    <button class="stat" data-act="water" data-n="1" aria-label="Adicionar um copo de água"><span class="eyebrow">Água</span><b>${water}<span class="muted" style="font-size:1rem">/${goal} copos</span></b>${bar(water / goal * 100, water >= goal ? 'ok' : '')}</button>
    <a class="stat" href="#eu" style="color:inherit;text-decoration:none"><span class="eyebrow">Hábitos</span><b>${habN}<span class="muted" style="font-size:1rem">/${S.habits.length}</span></b>${bar(S.habits.length ? habN / S.habits.length * 100 : 0)}</a>
    <a class="stat" href="#financas" style="color:inherit;text-decoration:none"><span class="eyebrow">Gastos hoje</span><b style="font-size:1.45rem">${money(spentToday)}</b><span class="small muted">saldo do mês ${money(monthTotals(mKey(d)).bal)}</span></a>
  </section>
  <section class="card">
    <div class="sec-head"><h2>Tarefas de hoje</h2><button class="link" data-act="newTask" data-date="${d}">+ Nova</button></div>
    ${tasks.length ? `<ul class="list">${tasks.map(t => taskItem(t, d)).join('')}</ul>` : `<p class="empty">Nenhuma tarefa para hoje. Toque em “+ Nova” para planejar o dia.</p>`}
  </section>
  <section class="card">

/* ciclo */
function cycleStats() {
  const p = [...S.periods].sort((a, b) => a.start.localeCompare(b.start));
  const gaps = []; for (let i = 1; i < p.length; i++) { const g = daysBetween(p[i - 1].start, p[i].start); if (g >= 15 && g <= 60) gaps.push(g); }
  const rg = gaps.slice(-6), cyc = rg.length ? Math.round(sum(rg, x => x) / rg.length) : 28;
  const lens = p.filter(x => x.end).map(x => daysBetween(x.start, x.end) + 1).slice(-6), len = lens.length ? Math.round(sum(lens, x => x) / lens.length) : 5;
  const last = p[p.length - 1] || null;
  return { p, cyc, len, last, next: last ? addDays(last.start, cyc) : null, n: p.length };
}
function periodKind(d, cs) {
  let lastEnd = '';
  for (const x of cs.p) { const end = x.end || addDays(x.start, cs.len - 1); if (d >= x.start && d <= end) return 'real'; if (end > lastEnd) lastEnd = end; }
  if (!cs.next) return '';
  for (let k = 0; k < 3; k++) { const s = addDays(cs.next, k * cs.cyc); if (s <= lastEnd) continue; if (d >= s && d <= addDays(s, cs.len - 1)) return 'pred'; }
  return '';
}
function euCiclo() {
  const cs = cycleStats(), t = today(), open = cs.last && !cs.last.end && daysBetween(cs.last.start, t) < 12;
  let hero;
  if (!cs.n) hero = `<span class="eyebrow">Seu ciclo</span><b>Comece registrando</b><p class="small muted">Marque o primeiro dia da próxima menstruação, ou registre as últimas datas, para o app calcular a previsão.</p>`;
  else if (open) hero = `<span class="eyebrow">Menstruação</span><b>Dia ${daysBetween(cs.last.start, t) + 1}</b><p class="small muted">Começou em ${fmtShort(cs.last.start)}. Duração média: ${cs.len} dias.</p>`;
  else { const n = daysBetween(t, cs.next);
    hero = `<span class="eyebrow">Dia ${daysBetween(cs.last.start, t) + 1} do ciclo</span><b>${n > 0 ? `Em ${n} ${n === 1 ? 'dia' : 'dias'}` : n === 0 ? 'Prevista para hoje' : `Atrasada ${-n} ${n === -1 ? 'dia' : 'dias'}`}</b><p class="small muted">Próxima menstruação prevista: ${esc(fmtLong(cs.next))}.</p>`; }
  return `<section class="cycle-hero">${hero}<div class="btn-row">${open ? `<button class="btn" data-act="periodEnd">Terminou hoje</button>` : `<button class="btn" data-act="periodStart">Começou hoje</button>`}<button class="btn ghost" data-act="newPeriod" style="background:var(--surface)">Registrar datas</button></div></section>
  ${cs.n ? `<section class="stats"><div class="stat"><span class="eyebrow">Ciclo médio</span><b>${cs.cyc}<span class="muted" style="font-size:1rem"> dias</span></b></div><div class="stat"><span class="eyebrow">Menstruação</span><b>${cs.len}<span class="muted" style="font-size:1rem"> dias</span></b></div></section>` : ''}
  <section class="card"><div class="sec-head"><h2>Histórico</h2><span class="small muted">${cs.n} ${cs.n === 1 ? 'registro' : 'registros'}</span></div>
    ${cs.n ? `<ul class="list">${[...cs.p].reverse().map(x => `<li><span class="emo">🌸</span><button class="row-main" data-act="editPeriod" data-id="${x.id}"><span class="t">${fmtShort(x.start)} → ${x.end ? fmtShort(x.end) : 'em andamento'}</span><small>${x.end ? (daysBetween(x.start, x.end) + 1) + ' dias' : ''}</small></button></li>`).join('')}</ul>` : '<p class="empty">Nenhum registro ainda.</p>'}
    <p class="small muted">A previsão usa a média dos seus últimos ciclos e aparece na Agenda. É só uma estimativa e não serve como método contraceptivo.</p></section>`;
}

let charts = [];
function drawCharts() {
  charts.forEach(c => c.destroy()); charts = [];

  Chart.defaults.font.family = 'Jost, system-ui, sans-serif'; Chart.defaults.color = v('--muted');
  const dn = document.getElementById('chDonut');

    charts.push(new Chart(dn, { type: 'doughnut', data: { labels: spent.map(([c]) => cat(c).name), datasets: [{ data: spent.map(x => x[1] / 100), backgroundColor: spent.map((_, i) => PALETTE[i % PALETTE.length]), borderColor: v('--surface'), borderWidth: 3, hoverOffset: 6 }] },
      options: { cutout: '68%', maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${c.label}: ${BRL.format(c.raw)}` } } } } }));

      { label: 'Receitas', data: tot.map(t => t.inc / 100), backgroundColor: v('--ok'), borderRadius: 6, maxBarThickness: 16 },
      { label: 'Despesas', data: tot.map(t => t.out / 100), backgroundColor: v('--rose'), borderRadius: 6, maxBarThickness: 16 }] },
      options: { maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${BRL.format(c.raw)}` } } },
        scales: { x: { grid: { display: false }, border: { display: false } }, y: { grid: { color: v('--line') }, border: { display: false }, ticks: { callback: x => 'R$ ' + Number(x).toLocaleString('pt-BR', { notation: 'compact' }) } } } } }));

const TABS = ['hoje', 'agenda', 'financas', 'eu', 'mais'];
function applyTheme() {

function render() {

/* ---------- toast, sheet, confirmação ---------- */
let toastT;
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }
const layer = document.getElementById('layer');
function closeSheet() { layer.innerHTML = ''; document.body.style.overflow = ''; }
function openSheet({ title, body, submit = 'Salvar', onSubmit, onDelete, deleteLabel = 'Apagar', onOpen }) {
  layer.innerHTML = `<div class="overlay" data-close="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="grip"></div><div class="sheet-head"><h2>${esc(title)}</h2><button class="icon-btn" data-close="1" aria-label="Fechar">${ICON.close}</button></div>
    <form class="fields" id="sheetForm" novalidate>${body}
      <p class="small" id="formErr" style="color:var(--bad)" hidden></p>
      <button class="btn block" type="submit">${esc(submit)}</button>
      ${onDelete ? `<button class="btn danger block" type="button" id="sheetDel">${esc(deleteLabel)}</button>` : ''}
    </form></div></div>`;
  document.body.style.overflow = 'hidden';
  const form = document.getElementById('sheetForm');
  form.addEventListener('submit', e => {
    e.preventDefault();
    const err = onSubmit(new FormData(form), form);
    if (typeof err === 'string') { const p = document.getElementById('formErr'); p.textContent = err; p.hidden = false; return; }
    closeSheet();
  });
  if (onDelete) document.getElementById('sheetDel').onclick = async () => { if (await askConfirm('Apagar este item?', 'Isso não pode ser desfeito.')) { onDelete(); closeSheet(); } };
  onOpen && onOpen(form);
  const f = form.querySelector('input:not([type=hidden]):not([type=radio]):not([type=checkbox]),select'); if (f && !f.value) setTimeout(() => f.focus(), 250);
}
layer.addEventListener('click', e => { if (e.target.closest('[data-close]') && (e.target.dataset.close || e.target.closest('button[data-close]'))) closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && layer.innerHTML) closeSheet(); });
function askConfirm(title, text, ok = 'Apagar') {
  return new Promise(res => {
    const wrap = document.createElement('div');
    wrap.className = 'overlay center'; wrap.style.zIndex = 70;
    wrap.innerHTML = `<div class="dialog" role="alertdialog" aria-modal="true"><h2>${esc(title)}</h2><p class="muted">${esc(text)}</p><div class="btn-row" style="justify-content:flex-end"><button class="btn ghost" data-r="0">Cancelar</button><button class="btn" data-r="1" style="background:var(--bad)">${esc(ok)}</button></div></div>`;
    wrap.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b || e.target === wrap) { wrap.remove(); res(b ? b.dataset.r === '1' : false); } });
    document.body.appendChild(wrap); wrap.querySelector('[data-r="1"]').focus();
  });
}

/* ---------- backup ---------- */
async function exportData() {
  const data = JSON.stringify(S, null, 1), filename = `planner-backup-${today()}.json`;
  let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data }); S.settings.lastBackup = today(); commit('Backup salvo ♡'); return; }
    catch (err) { if (err && err.code === 'declined') { toast('Backup cancelado.'); return; } if (err && err.code === 'rate_limited') { toast('Aguarde um instante e tente de novo.'); return; } }
  }
  if (!window.claude) { // versão independente: download comum do navegador
    try {
      const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      S.settings.lastBackup = today(); commit('Backup baixado ♡ Guarde o arquivo no Drive ou no e-mail.'); return;
    } catch (e) { /* cai no modo copiar */ }
  }
  openSheet({ title: 'Copiar backup', submit: 'Copiar e fechar',
    body: `<p class="small muted">Não foi possível baixar o arquivo aqui. Copie o texto abaixo e cole numa nota ou e-mail para guardar.</p><label class="f">Backup<textarea id="bkText" rows="8" readonly>${esc(data)}</textarea></label>`,
    onSubmit: () => { const ta = document.getElementById('bkText'); (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject()).then(() => toast('Backup copiado')).catch(() => { ta.select(); toast('Selecione e copie o texto'); }); S.settings.lastBackup = today(); save(); return 'Backup copiado. Pode fechar.'; } });
}
document.getElementById('importFile').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    let o; try { o = JSON.parse(r.result); } catch (err) { toast('Arquivo inválido: não é um backup do planner.'); return; }
    if (!o || !o.settings || !Array.isArray(o.tasks)) { toast('Arquivo inválido: não é um backup do planner.'); return; }
    if (!await askConfirm('Importar backup?', 'Os dados atuais deste aparelho serão substituídos pelos do arquivo.', 'Importar')) return;
    S = migrate(o); S.settings.onboarded = true; commit('Backup importado ♡');
  };
  r.readAsText(f);
});

/* ---------- boas-vindas ---------- */
function onboarding() {
  if (document.getElementById('onb')) return;
  const w = document.createElement('div'); w.className = 'overlay center'; w.id = 'onb'; w.style.zIndex = 80;
  w.innerHTML = `<form class="dialog onboard" id="onbForm"><span class="mark" aria-hidden="true">✿</span><h1 style="font-size:2rem">Seu planner</h1>
    <p class="muted">Tarefas, agenda, finanças e autocuidado num lugar só. Como você quer ser chamada?</p>
    <label class="f" style="width:100%;text-align:left">Seu nome<input name="name" id="onbName" maxlength="30" autocomplete="given-name" placeholder="opcional"></label>
    <div class="btn-row" style="width:100%;flex-direction:column"><button class="btn block" name="mode" value="zero">Começar do zero</button><button class="btn ghost block" name="mode" value="sample">Ver com dados de exemplo</button></div></form>`;
  document.body.appendChild(w);
  w.querySelector('form').addEventListener('submit', e => {
    e.preventDefault(); const name = w.querySelector('#onbName').value.trim(); const mode = e.submitter ? e.submitter.value : 'zero';
    if (mode === 'sample') S = sampleData(name); else { S.settings.name = name; S.settings.createdAt = today(); }
    S.settings.onboarded = true; w.remove(); commit(name ? `Que bom te ver, ${name} ♡` : 'Bem-vinda ♡');
  });
}
